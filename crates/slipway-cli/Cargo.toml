[package]
name = "slipway-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Slipway: правила коммитов, калитка и хуки — команда cargo slipway"
readme = "README.md"
keywords = ["cargo-subcommand", "git-hooks", "commit-message", "journal", "methodology"]
categories = ["development-tools::cargo-plugins", "command-line-utilities"]

# Бинарь с именем cargo-slipway вызывается как `cargo slipway`.
[[bin]]
name = "cargo-slipway"
path = "src/main.rs"

[lints]
workspace = true

# Хук собирает инструмент, и сборка не тянет граф крейтов: внешних
# зависимостей нет (решение 14). Единственная зависимость — slipway-journal
# того же рабочего пространства без собственных зависимостей: автомат журнала
# у сборки реестра и у инструмента один (решение 15).
[dependencies]
slipway-journal = { workspace = true }
