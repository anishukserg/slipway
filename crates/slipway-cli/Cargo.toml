[package]
name = "slipway-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Slipway: правила коммитов, калитка и хуки — команда cargo slipway"

# Бинарь с именем cargo-slipway вызывается как `cargo slipway`.
[[bin]]
name = "cargo-slipway"
path = "src/main.rs"

[lints]
workspace = true

# Зависимостей нет и без отдельного решения не будет: хук собирает инструмент,
# и сборка не тянет граф крейтов (решение 14).
