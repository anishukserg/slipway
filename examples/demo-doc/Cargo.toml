[package]
name = "demo-doc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Демо-реестр: показывает, что ссылка-путь резолвится компилятором"
publish = false

# Раскладка реестра, которую методология предлагает продуктам: документы
# в корне крейта, без каталога src (решение 10).
[lib]
path = "lib.rs"

# Строгий профиль lints продукта (решение 16) — тот же, что в doc/Cargo.toml.
# Демо-реестр задействует эмиттеры, которых нет в документах Slipway: разметку
# кода и замещённые решения. Меняется в обоих манифестах одним коммитом.
[lints.rust]
unsafe_code = "forbid"
unstable_features = "forbid"
missing_docs = "forbid"
missing_debug_implementations = "forbid"
unreachable_pub = "forbid"
elided_lifetimes_in_paths = "forbid"
trivial_casts = "forbid"
trivial_numeric_casts = "forbid"
unused_qualifications = "forbid"
unused_lifetimes = "forbid"
single_use_lifetimes = "forbid"

[lints.clippy]
pedantic = { level = "forbid", priority = -1 }

[lints.rustdoc]
broken_intra_doc_links = "forbid"
private_intra_doc_links = "forbid"
unescaped_backticks = "forbid"

[dependencies]
slipway-core = { workspace = true }
slipway-knowledge = { workspace = true }
chrono = { workspace = true }

[build-dependencies]
slipway-scan = { workspace = true }
