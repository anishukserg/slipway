# Тулчейн разработки Slipway (решение 12): stable с точной версией; смена
# версии — отдельный коммит через калитку. Коды ошибок атак сверяются на нём же
# под RUSTC_BOOTSTRAP=1 в шаге калитки. Потребителям крейтов достаточно
# rust-version из Cargo.toml.
[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy"]
profile = "minimal"
