[workspace]
resolver = "2"
members = ["crates/*", "doc", "examples/demo-doc", "examples/demo-product"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
# Лицензия и публичный адрес — решение 17.
license = "Apache-2.0"
repository = "https://github.com/anishukserg/slipway"

[workspace.lints.rust]
# Небезопасный код в крейтах методологии невыразим, а не «проверяется ревью».
unsafe_code = "forbid"
# Нестабильные возможности невыразимы и под RUSTC_BOOTSTRAP шага атак
# (решение 12). На doctest lints манифеста не распространяются — там тот же
# запрет ставит атрибут doc(test(attr(...))) в корне каждого крейта.
unstable_features = "forbid"

[workspace.dependencies]
# Версия у path-зависимостей обязательна публикуемым крейтам (решение 13).
slipway-core = { path = "crates/slipway-core", version = "0.1.0" }
slipway-knowledge = { path = "crates/slipway-knowledge", version = "0.1.0" }
slipway-work = { path = "crates/slipway-work", version = "0.1.0" }
slipway-scan = { path = "crates/slipway-scan", version = "0.1.0" }
slipway-derive = { path = "crates/slipway-derive", version = "0.1.0" }
slipway-journal = { path = "crates/slipway-journal", version = "0.1.0" }
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
chrono = { version = "0.4.32", default-features = false, features = ["std"] }
